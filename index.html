<script>
const M=[
{t:'Fondasi coding dan cara kerja web',l:[
['Cara kerja internet','Browser (client) mengirim request, server membalas dengan response. Hampir semua aplikasi bekerja dengan pola ini.'],
['API dan JSON','API adalah pintu komunikasi antar sistem. Datanya biasanya berbentuk JSON: pasangan nama dan nilai.'],
['Logika pemrograman','Variabel menyimpan nilai, if/else membuat keputusan, loop mengulang, function membungkus langkah yang bisa dipakai ulang.'],
['Git dan GitHub','Git menyimpan riwayat perubahan kode lewat commit. Branch dan pull request dipakai untuk bekerja bersama dengan aman.']],
x:[['Panggil API publik dan tampilkan datanya',`<!DOCTYPE html>
<html><body>
<h3>Daftar Pengguna</h3>
<ul id="daftar"></ul>
<script>
fetch("https://jsonplaceholder.typicode.com/users")
  .then(res => res.json())
  .then(data => {
    data.forEach(u => {
      document.getElementById("daftar").innerHTML += "<li>" + u.name + " - " + u.email + "</li>";
    });
  });
<\/script>
</body></html>`,'Simpan sebagai index.html, lalu buka di browser. Anda akan melihat 10 nama pengguna. Ini adalah request ke server dan response berbentuk JSON.'],
['Simpan ke Git',`git init
git add .
git commit -m "latihan pertama: panggil API"`,'Jalankan di terminal pada folder yang sama. Lalu buat repository di GitHub dan push dengan perintah yang ditampilkan GitHub.'],
['Ubah sedikit lalu commit lagi',`// Ganti baris data.forEach menjadi ini agar hanya 3 pengguna pertama tampil:
data.slice(0, 3).forEach(u => {`,'Muat ulang browser dan pastikan hanya 3 nama tampil. Lalu jalankan git add . dan git commit lagi dengan pesan baru.']],p:'Panggil API lain (misalnya data cuaca atau kurs), tampilkan 5 data di halaman, dan simpan kodenya di GitHub.',},
{t:'Database dan SQL',l:[
['Tabel, kolom, dan key','Primary key mengenali tiap baris secara unik. Foreign key menunjuk ke baris di tabel lain.'],
['Jenis relasi','One-to-one, one-to-many (satu user banyak order), dan many-to-many yang butuh tabel penghubung.'],
['SQL dasar dan JOIN','SELECT, INSERT, UPDATE, DELETE, WHERE, GROUP BY. JOIN menggabungkan data dari beberapa tabel.'],
['Row Level Security','RLS membatasi baris mana yang boleh dibaca atau diubah tiap user, langsung di level database.']],
x:[['Buat tabel dan relasi',`create table organizations (
  id uuid primary key default gen_random_uuid(),
  name text not null,
  created_at timestamptz default now()
);

create table members (
  user_id uuid references auth.users(id) on delete cascade,
  organization_id uuid references organizations(id) on delete cascade,
  role text default 'member',
  primary key (user_id, organization_id)
);

create table projects (
  id uuid primary key default gen_random_uuid(),
  organization_id uuid references organizations(id) on delete cascade,
  title text not null,
  status text default 'baru'
);`,'Buka Supabase, masuk ke SQL Editor, tempel, lalu Run. Cek di Table Editor bahwa tiga tabel sudah muncul.'],
['Isi data dan gabungkan dengan JOIN',`insert into organizations (name) values ('Toko A'), ('Toko B');

insert into projects (organization_id, title)
select id, 'Proyek pertama' from organizations;

select o.name, p.title, p.status
from projects p
join organizations o on o.id = p.organization_id;`,'Hasil query terakhir harus menampilkan dua baris: satu per organisasi.'],
['Aktifkan Row Level Security',`alter table projects enable row level security;

create policy "baca proyek organisasi sendiri" on projects
for select using (
  organization_id in (
    select organization_id from members where user_id = auth.uid()
  )
);`,'Setelah RLS aktif, user yang belum menjadi member tidak melihat proyek apa pun. Itu tandanya RLS bekerja.']],p:'Rancang skema 4 tabel untuk produk Anda sendiri dan tulis 15 query SQL sendiri (SELECT, JOIN, GROUP BY).',},
{t:'Membangun aplikasi lengkap',l:[
['Authentication dan authorization','Authentication memastikan siapa user. Authorization menentukan apa yang boleh dia lakukan.'],
['CRUD dari ujung ke ujung','Create, Read, Update, Delete: form mengirim data ke API, tersimpan di database, lalu tampil kembali di layar.'],
['Environment variable dan keamanan','Secret key disimpan di environment variable di server. Jangan pernah menaruhnya di kode frontend atau GitHub publik.'],
['Deploy','Deploy menayangkan aplikasi ke internet, misalnya lewat Vercel atau Netlify, lengkap dengan domain sendiri.']],
x:[['Hubungkan halaman web ke Supabase',`<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>
<script>
const db = supabase.createClient("URL_PROYEK_ANDA", "ANON_PUBLIC_KEY_ANDA");

async function masuk(email, password) {
  const { error } = await db.auth.signInWithPassword({ email, password });
  if (error) alert(error.message);
}
async function tambah(judul) {
  const { error } = await db.from("projects").insert({ title: judul });
  if (error) alert(error.message);
}
async function baca() {
  const { data } = await db.from("projects").select("*");
  console.log(data);
}
<\/script>`,'Ambil URL dan anon public key di Supabase (Project Settings, API). Pakai hanya anon key di frontend, jangan pernah service_role key.'],
['Simpan rahasia di environment variable',`# file .env (jangan di-commit)
SUPABASE_URL=isi_url_anda
SUPABASE_ANON_KEY=isi_key_anda

# file .gitignore
.env`,'Pastikan .env masuk .gitignore sebelum git add. Coba cek di GitHub bahwa file .env tidak ikut ter-upload.'],
['Deploy ke internet',`1. Push project ke GitHub
2. Buka vercel.com, login dengan GitHub
3. Klik Add New Project, pilih repository Anda
4. Isi environment variable yang sama
5. Klik Deploy`,'Setelah selesai, Anda mendapat link publik. Buka dari HP dan coba login serta tambah data.']],p:'Bangun app sendiri dengan login dan CRUD untuk satu jenis data, deploy, lalu uji dengan 2 sampai 3 orang.',},
{t:'Konsep khusus SaaS',l:[
['Multi-tenancy','Satu aplikasi melayani banyak organisasi (tenant) dengan data yang terpisah. Ini pembeda utama SaaS.'],
['Role dan permission','Owner, admin, dan member punya hak berbeda. Aturannya dicek di backend, bukan hanya disembunyikan di UI.'],
['Subscription dan billing','Plan, trial, upgrade/downgrade. Di Indonesia gunakan Midtrans atau Xendit. Status pembayaran diperbarui lewat webhook.'],
['Metrik SaaS','MRR (pendapatan berulang bulanan), churn (pelanggan yang berhenti), CAC, LTV, dan activation.']],
x:[['Tambahkan plan ke organisasi',`alter table organizations add column plan text default 'free';

update organizations set plan = 'free';`,'Setiap organisasi sekarang punya plan. Cek hasilnya di Table Editor.'],
['Batasi plan Free di database',`create or replace function cek_batas_proyek() returns trigger as $$
begin
  if (select plan from organizations where id = new.organization_id) = 'free'
     and (select count(*) from projects where organization_id = new.organization_id) >= 3 then
    raise exception 'Plan Free dibatasi 3 proyek. Upgrade ke Pro.';
  end if;
  return new;
end; $$ language plpgsql;

create trigger batas_proyek before insert on projects
for each row execute function cek_batas_proyek();`,'Tambahkan 3 proyek, lalu coba proyek ke-4. Anda akan mendapat pesan error. Aturan ini berlaku walau UI dilewati.'],
['Simulasikan webhook pembayaran dan hitung MRR',`-- Anggap webhook mengabarkan pembayaran sukses
update organizations set plan = 'pro' where name = 'Toko A';

-- Sekarang proyek ke-4 untuk Toko A akan berhasil

-- Hitung MRR jika plan Pro Rp99.000 per bulan
select count(*) filter (where plan = 'pro') * 99000 as mrr_rupiah
from organizations;`,'Di aplikasi nyata, perubahan plan dilakukan oleh server saat menerima webhook dari Midtrans atau Xendit, bukan manual.']],p:'Ubah app minggu 3 menjadi SaaS mini: organisasi, role, plan Free/Pro, dan pembayaran sandbox Midtrans atau Xendit.',}];
const PJ=['Database punya minimal 4 tabel berelasi (misalnya organizations, members, projects, subscriptions)','Daftar dan login berfungsi','RLS memisahkan data tiap organisasi','Ada plan Free dan Pro dengan batasan fitur','Pembayaran sandbox terhubung dan aplikasi sudah di-deploy ke link publik'];
const RD=[
{g:`Setelah materi ini, Anda bisa menjelaskan apa yang terjadi saat sebuah situs dibuka, serta membedakan client, server, request, dan response.`,
s:[
[`Dua pihak yang selalu terlibat`,`Setiap kali Anda membuka situs atau aplikasi, ada dua pihak yang bekerja. <b>Client</b> adalah perangkat atau browser Anda, pihak yang <i>meminta</i>. <b>Server</b> adalah komputer yang menyimpan data dan program, pihak yang <i>menjawab</i>. Server bukan alat ajaib: ia komputer biasa yang menyala terus-menerus, tersambung ke internet, dan biasanya ditempatkan di pusat data.`],
[`Request dan response`,`Komunikasi keduanya berpola tanya-jawab. Client mengirim <b>request</b> (permintaan), server membalas dengan <b>response</b> (jawaban). Request memuat alamat tujuan dan jenis permintaan: <code>GET</code> untuk mengambil data, <code>POST</code> untuk mengirim data baru. Response memuat isi yang diminta beserta kode status yang menjelaskan hasilnya.`,`Request dari browser:
GET /kursus HTTP/1.1
Host: yawin-academy.netlify.app

Response dari server:
HTTP/1.1 200 OK
Content-Type: text/html

<html> ...isi halaman... </html>`],
[`Apa yang terjadi saat Anda mengetik alamat situs`,`Ada lima langkah yang berlangsung dalam hitungan milidetik. (1) Browser mencari lokasi server lewat <b>DNS</b>, semacam buku telepon internet yang menerjemahkan nama situs menjadi alamat angka. (2) Browser mengirim request ke server itu. (3) Server memproses, kadang dengan mengambil data dari database. (4) Server mengirim response. (5) Browser menampilkan hasilnya sebagai halaman yang Anda lihat.`],
[`Kode status yang perlu dikenal`,`Setiap response membawa kode status. <code>200</code> berarti berhasil. <code>404</code> berarti server aktif tetapi halaman yang diminta tidak ada. <code>401</code> atau <code>403</code> berarti Anda belum login atau tidak berhak. <code>500</code> berarti ada kesalahan di sisi server. Kode ini nanti sering muncul saat Anda menguji aplikasi sendiri.`]
],
a:`Bayangkan restoran. Anda (client) memesan lewat pelayan. Dapur (server) menyiapkan makanan, lalu pelayan mengantarkannya. Pesanan adalah request, makanan yang datang adalah response. Kalau menu yang Anda minta tidak ada, dapur menjawab bahwa menu itu tidak tersedia, itulah 404.`,
k:[`Mengira data aplikasi tersimpan di HP atau browser. Data penting (akun, nilai, progres) tersimpan di server dan database, itu sebabnya Anda bisa masuk dari perangkat lain.`,`Menganggap 404 berarti internet mati. Justru sebaliknya: server aktif dan menjawab, hanya saja alamat yang diminta tidak ditemukan.`,`Mengira alamat <code>localhost</code> bisa dibuka orang lain. <code>localhost</code> hanya menunjuk ke komputer Anda sendiri, jadi aplikasi baru bisa diakses publik setelah dipasang di server atau hosting.`],
q:{q:`Anda membuka sebuah halaman dan server membalas dengan kode 404. Artinya apa?`,o:[`Internet Anda terputus`,`Server aktif, tetapi halaman yang diminta tidak ditemukan`,`Terjadi kesalahan di dalam program server`,`Kata sandi Anda salah`],a:1,e:`404 berarti server menjawab tetapi tidak menemukan halaman yang diminta. Kesalahan di dalam server adalah kode 500.`},
r:[`Client meminta, server menjawab.`,`Pola dasarnya adalah request lalu response.`,`Kode status menjelaskan hasil: 200 berhasil, 404 tidak ditemukan, 500 error server.`,`Data penting disimpan di server, bukan di perangkat pengguna.`]},

{g:`Setelah materi ini, Anda bisa menjelaskan apa itu API, membaca data JSON, dan memahami bagaimana sebuah aplikasi mengambil data dari server.`,
s:[
[`Apa itu API`,`API (Application Programming Interface) adalah pintu resmi untuk berkomunikasi dengan sebuah sistem. Aplikasi tidak membuka database orang lain secara langsung. Ia mengetuk API, meminta data dengan aturan yang jelas, lalu menerima jawabannya. Dengan begitu pemilik sistem tetap mengontrol apa yang boleh diakses.`],
[`JSON: bahasa data yang dipahami semua`,`Data yang dikirim API umumnya berbentuk <b>JSON</b>, yaitu pasangan <i>nama</i> dan <i>nilai</i> yang mudah dibaca manusia maupun mesin. Aturan penting: objek dibungkus kurung kurawal, daftar dibungkus kurung siku, teks memakai tanda kutip ganda, sedangkan angka dan true atau false ditulis tanpa kutip.`,`{
  "nama": "Sari",
  "umur": 27,
  "kota": "Medan",
  "hobi": ["membaca", "berenang"],
  "aktif": true
}`],
[`Endpoint dan metode`,`Setiap fungsi API punya alamat khusus yang disebut <b>endpoint</b>, misalnya <code>/users</code> untuk daftar pengguna. Metode menunjukkan tujuan: <code>GET</code> mengambil, <code>POST</code> menambah, <code>PATCH</code> mengubah, <code>DELETE</code> menghapus. Empat pasangan ini akan bertemu lagi sebagai CRUD di Minggu 3.`],

{g:`Setelah materi ini, Anda mengenal empat blok dasar pemrograman, yaitu variabel, percabangan, perulangan, dan function, serta bisa membaca program sederhana.`,
s:[
[`Variabel: kotak berlabel`,`Variabel menyimpan nilai dengan sebuah nama supaya bisa dipakai lagi. Nilai punya jenis: teks (string), angka (number), benar atau salah (boolean), daftar (array), dan objek. Program dibaca dari atas ke bawah, satu baris pada satu waktu.`,`let nama = "Sari";
let harga = 150000;
let lunas = false;`],
[`Percabangan: mengambil keputusan`,`Dengan <code>if</code> dan <code>else</code>, program memilih jalur berdasarkan kondisi. Kalau kondisinya benar, blok pertama dijalankan. Kalau tidak, blok <code>else</code> yang dijalankan.`,`let umur = 20;
if (umur >= 17) {
  console.log("Boleh membuat KTP");
} else {
  console.log("Belum boleh");
}`],
[`Perulangan: mengerjakan hal yang sama berkali-kali`,`Perulangan menjalankan blok kode berulang kali tanpa Anda menulisnya satu per satu. Pada contoh ini, program menyapa semua peserta dalam daftar. Perhatikan bahwa hitungan posisi dalam daftar dimulai dari 0, bukan 1.`,`let peserta = ["Sari", "Budi", "Citra"];
for (let i = 0; i < peserta.length; i++) {
  console.log("Halo, " + peserta[i]);
}`],
[`Function: resep yang bisa dipakai ulang`,`Function membungkus beberapa langkah dengan sebuah nama. Ia menerima bahan (parameter) dan mengembalikan hasil (return). Setelah dibuat sekali, function bisa dipanggil sebanyak yang diperlukan.`,`function hitungDiskon(harga, persen) {

}

a:`Anggap memasak. Variabel adalah bahan yang diberi label. If adalah keputusan: kalau terlalu asin, tambah air. Loop adalah perintah mengaduk sepuluh kali. Function adalah resep yang bisa Anda pakai ulang kapan saja tanpa menulisnya dari awal.`,

{g:`Setelah materi ini, Anda memahami fungsi Git dan GitHub, serta bisa menjelaskan alur dasar menyimpan perubahan (commit) dan mengirimnya ke GitHub (push).`,
s:[
[`Masalah yang diselesaikan Git`,`Pernah punya berkas bernama <code>laporan_final_revisi_baru_FIX2.docx</code>? Itu masalah yang diselesaikan Git. Git mencatat riwayat perubahan kode, sehingga Anda bisa melihat apa yang berubah, kapan, dan oleh siapa, lalu kembali ke versi sebelumnya kalau ada yang rusak.`],
[`Git dan GitHub itu berbeda`,`<b>Git</b> adalah program yang berjalan di komputer Anda untuk mencatat riwayat. <b>GitHub</b> adalah situs untuk menyimpan salinan proyek Git secara online, berbagi, dan bekerja bersama. Folder proyek yang dilacak Git disebut <b>repository</b>. Netlify dan Vercel juga membaca repository dari GitHub untuk men-deploy aplikasi.`],
[`Alur dasar: tahap awal dan tahap rutin`,`Alurnya terbagi dua. <b>Tahap awal, cukup sekali per proyek:</b> <code>git init</code> mengaktifkan Git di folder itu. <code>git branch -M main</code> memastikan cabang utamanya bernama <code>main</code>. <code>git remote add origin ALAMAT</code> memberi tahu Git alamat repository GitHub tempat salinan online akan disimpan. <code>remote</code> berarti lokasi di luar komputer Anda, dan <code>origin</code> hanyalah nama panggilan untuk alamat itu (kebiasaan umum). Alamatnya Anda salin dari halaman repository yang baru dibuat di GitHub. <b>Tahap rutin, setiap ada perubahan:</b> <code>add</code> memilih perubahan yang akan disimpan, <code>commit</code> menyimpannya sebagai satu titik riwayat beserta catatan, dan <code>push</code> mengirimnya ke GitHub. Tanda <code>-u origin main</code> pada push pertama menghubungkan cabang main di komputer Anda dengan main di GitHub, sehingga berikutnya cukup mengetik <code>git push</code>.`,`# TAHAP AWAL (sekali saja)
git init                               # mulai melacak folder ini
git branch -M main                     # beri nama cabang utama: main
git remote add origin https://github.com/namaanda/yawin-academy.git
# ^ simpan alamat GitHub dengan nama panggilan "origin"

# TAHAP RUTIN (setiap ada perubahan)
git add .                              # pilih semua perubahan
git commit -m "tambah halaman login"   # simpan + catatan
git push -u origin main                # kirim ke GitHub
# ^ untuk push berikutnya cukup: git push`],
[`Branch dan pull request`,`<b>Branch</b> adalah cabang untuk mencoba fitur baru tanpa mengganggu versi utama (biasanya bernama <code>main</code>). Kalau fitur sudah siap, Anda mengajukan <b>pull request</b>, yaitu permintaan agar cabang itu digabungkan setelah ditinjau. Saat bekerja sendirian, Anda boleh langsung memakai <code>main</code>, tetapi pada tim kebiasaan ini menjaga versi utama tetap aman.`]
],
a:`Git seperti fitur riwayat versi pada dokumen online, tetapi untuk seluruh folder proyek, dan Anda yang memutuskan kapan mengambil foto (commit). Foto-foto itu tersusun berurutan, sehingga Anda bisa kembali ke salah satunya kapan saja.`,
k:[`Meng-commit berkas rahasia seperti <code>.env</code> atau kunci API. Daftarkan berkas itu ke <code>.gitignore</code> sebelum <code>git add</code>.`,`Menulis catatan commit seperti update atau fix. Tulis yang spesifik, misalnya perbaiki validasi email, supaya riwayatnya berguna.`,`Lupa <code>git add</code> sebelum <code>git commit</code>, sehingga tidak ada perubahan yang tersimpan.`,`Mengira commit sudah mengirim kode ke GitHub. Commit hanya menyimpan di komputer Anda, pengiriman dilakukan oleh <code>push</code>.`,`Muncul error <code>remote origin already exists</code>. Artinya nama origin sudah terpakai di folder itu. Lihat alamatnya dengan <code>git remote -v</code>, dan ubah dengan <code>git remote set-url origin ALAMAT_BARU</code>.`],
q:{q:`Urutan yang benar untuk menyimpan perubahan lalu mengirimnya ke GitHub adalah...`,o:[`commit, add, push`,`add, commit, push`,`push, add, commit`,`add, push, commit`],a:1,e:`Pilih perubahan dengan add, simpan dengan commit, lalu kirim dengan push.`},
r:[`Git mencatat riwayat perubahan kode.`,`GitHub menyimpan repository online dan memudahkan kerja bersama.`,`Alurnya add, commit, push.`,`Jangan pernah meng-commit berkas rahasia seperti .env.`]}

function auth(){return `<h1>YAWIN SaaS Academy</h1><p class="mu">Masuk untuk menyimpan progres dan mendapatkan sertifikat yang bisa diverifikasi.</p><div class="c" style="margin-top:14px"><input type="text" id="nm" placeholder="Nama lengkap (untuk mendaftar)" autocomplete="name"><input type="email" id="em" placeholder="Email" autocomplete="email" style="margin-top:8px"><input type="password" id="pw" placeholder="Kata sandi (minimal 6 karakter)" autocomplete="current-password" style="margin-top:8px"><div class="row"><button onclick="signin()">Masuk</button><button class="g" onclick="signup()">Daftar</button></div></div><div class="c" style="margin-top:14px"><b>Verifikasi sertifikat</b><input type="text" id="vc" placeholder="YAWIN-XXXXXXXX"><div class="row"><button class="g" onclick="vcert()">Periksa</button></div>${VR}</div>`}
function home(){const p=pct(),cur=M.findIndex((_,i)=>!qOK(i));
let h=`<div class="row" style="justify-content:space-between;align-items:center;margin:0 0 10px"><span class="tg">${esc(U.email)}</span><button class="g cp" onclick="db.auth.signOut()">Keluar</button></div><h1>YAWIN SaaS Academy</h1><p class="mu">Halo, ${esc(fn())}! ${motiv(p)}</p><div class="pb"><i style="width:${p}%"></i></div><p class="tg">${p}% selesai</p>${resume()}${cta()}<div class="rail">`;
M.forEach((m,i)=>{const ok=qOK(i),lk=i>0&&!qOK(i-1);h+=`<div class="st ${ok?'on':''} ${i===cur?'cur':''} ${lk?'lk':''}"><div class="c" ${lk?'':`onclick="go('m${i}')"`}><b>${IC[i]} Minggu ${i+1}: ${m.t}</b><p class="mu">${m.l.filter((_,j)=>P.d[i+'-'+j]).length}/4 materi, bukti praktik ${P.pr[i]?'terverifikasi':'belum'}, kuis ${P.q['m'+i]!=null?'terbaik '+P.q['m'+i]+'%':'belum dikerjakan'}${lk?' (selesaikan minggu sebelumnya)':''}</p></div></div>`});
h+=`<div class="st ${pOK()?'on':''} ${allQ()?'':'lk'}"><div class="c" ${allQ()?`onclick="go('pj')"`:''}><b>Proyek akhir: SaaS mini</b><p class="mu">${pOK()?'Lulus':allQ()?'Kirim proyek untuk diperiksa server':'Terbuka setelah semua kuis lulus'}</p></div></div>`;
h+=`<div class="st ${fOK()?'on':''} ${allQ()&&pOK()?'':'lk'}"><div class="c" ${allQ()&&pOK()?`onclick="start('f')"`:''}><b>Ujian akhir (8 soal, nilai minimal 80)</b><p class="mu">${P.q.f!=null?'Nilai terbaik '+P.q.f+'%':'Belum dikerjakan'}</p></div></div>`;
h+=`<div class="st ${P.cert?'on':fOK()?'':'lk'}"><div class="c" ${fOK()?`onclick="go('cert')"`:''}><b>Sertifikat kelulusan</b><p class="mu">${P.cert?'Sudah terbit, ID '+esc(P.cert.id):fOK()?'Selamat, terbitkan sertifikat Anda':'Terbuka setelah ujian akhir lulus'}</p></div></div></div>`;return h}
function vbox(i){const q=(P.proofs.find(p=>p.module_idx===i)||{}).question||'';const h=`<div class="c"><b>Bukti: ${esc(q)}</b>`;if(P.pr[i])return h+'<div class="bn p">Terverifikasi oleh server. Anda sudah menjalankan contoh ini.</div></div>';return h+`<input type="text" id="v${i}" placeholder="Jawaban Anda"><div class="row"><button onclick="vf(${i})">Periksa jawaban</button></div></div>`}
function mod(i){const m=M[i],all=mDone(i);let h=`<a class="bk" onclick="go('home')">Kembali ke daftar</a><h2>Minggu ${i+1}: ${m.t}</h2>${m.r?'<p class="mu">Buka tiap materi, baca sampai selesai, lalu jawab cek pemahaman untuk menyelesaikannya.</p>':'<p class="mu">Materi minggu ini masih berupa ringkasan, materi lengkap menyusul. Centang setelah Anda benar-benar memahaminya.</p>'}`;
m.l.forEach(([t,d],j)=>{if(m.r){const dn=P.d[i+'-'+j];h+=`<div class="c lesson ${dn?'dn':''}" onclick="go('r${i}-${j}')"><div class="lb">${dn?'✅':'📖'}</div><div><b>${t}</b><p class="mu">${d}</p><p class="tg">⏱ ${rt(m.r[j])} menit baca · ${dn?'Selesai':'Belum dibaca'}</p></div></div>`}else h+=`<label class="c l"><input type="checkbox" ${P.d[i+'-'+j]?'checked':''} onchange="tg(${i},${j})"><span><b>${t}</b><br><span class="mu">${d}</span></span></label>`});
h+=`<h2 style="margin-top:22px">Contoh praktik: tiru dulu</h2><p class="mu">Salin atau ketik kode di bawah, jalankan sendiri, dan pastikan hasilnya sama sebelum lanjut.</p>`;
m.x.forEach(([t,k,n],j)=>{h+=`<div class="c" style="margin:10px 0"><b>Langkah ${j+1}: ${t}</b><pre>${esc(k)}</pre><button class="cp g" onclick="cp(${i},${j},this)">Salin kode</button><p class="mu">${n}</p></div>`});
h+=vbox(i)+`<div class="c" style="margin-top:12px"><b>Tantangan mandiri</b><p class="mu">${m.p}</p></div><div class="row"><button ${all?'':'disabled'} onclick="start('m${i}')">${all?'Mulai kuis (lulus 70%)':'Selesaikan materi dan bukti praktik untuk membuka kuis'}</button></div>`;return h}
function quiz(){let h=`<a class="bk" onclick="go('home')">Kembali ke daftar</a><h2>${A.k==='f'?'Ujian akhir':'Kuis minggu '+(+A.k.slice(1)+1)}</h2><p class="mu">Nilai minimal untuk lulus: ${A.th}%</p>`;
A.qs.forEach((q,i)=>{const rv=A.rev&&A.rev[q.id];h+=`<div class="c" style="margin:10px 0"><b>${i+1}. ${esc(q.question)}</b>`;q.options.forEach((o,j)=>{let c='o';if(rv){if(o===rv.correct)c+=' ok';else if(j===q.s)c+=' no'}else if(j===q.s)c+=' s';h+=`<button class="${c}" onclick="pick(${i},${j})">${esc(o)}</button>`});if(rv)h+=`<div class="ex">${esc(rv.explanation)}</div>`;h+='</div>'});
if(A.r===null)h+=`<div class="row"><button ${A.qs.some(q=>q.s<0)?'disabled':''} onclick="sub()">Kirim jawaban</button></div>`;
else{const ok=A.r>=A.th;h=h.replace('</h2>',`</h2><div class="bn ${ok?'p':'f'}">Nilai Anda ${A.r}%. ${ok?'Lulus!':'Belum lulus, pelajari lagi dan coba kembali.'}</div>`);h+=`<div class="row"><button onclick="start('${A.k}')" class="g">Ulangi</button><button onclick="go('${ok&&A.k==='f'?'cert':'home'}')">${ok&&A.k==='f'?'Ambil sertifikat':'Lanjut'}</button></div>`}return h}
function pj(){const st=(k,t)=>PS?`<p class="tg">${PS[k]?'Lolos':'Belum lolos'}: ${t}</p>`:'';
let h=`<a class="bk" onclick="go('home')">Kembali ke daftar</a><h2>Proyek akhir: SaaS mini</h2><p class="mu">Isi semua bagian, lalu kirim. Server yang memeriksa checklist, link, nama tabel, dan policy RLS Anda.</p>`;
PJ.forEach((t,i)=>h+=`<label class="c l"><input type="checkbox" ${PD.c.includes(i)?'checked':''} onchange="tp(${i})"><span>${t}</span></label>`);
h+=`<div class="c" style="margin-top:12px"><b>Link aplikasi atau repository</b><p class="mu">Harus https dan berasal dari github.com, vercel.app, netlify.app, pages.dev, atau onrender.com.</p><input type="url" placeholder="https://" value="${esc(PD.u)}" oninput="PD.u=this.value">${st('url','link')}</div><div class="c" style="margin-top:12px"><b>Nama tabel yang Anda buat</b><p class="mu">Pisahkan dengan koma, minimal 4 nama berbeda.</p><input type="text" placeholder="organizations, members, projects, subscriptions" value="${esc(PD.t)}" oninput="PD.t=this.value">${st('tables','nama tabel')}</div><div class="c" style="margin-top:12px"><b>Tempel policy RLS yang Anda tulis</b><textarea rows="5" placeholder="create policy ... using (...)" oninput="PD.r=this.value">${esc(PD.r)}</textarea>${st('policy','policy RLS')}</div>`;
h+=PS?`<div class="bn ${PS.passed?'p':'f'}">${PS.passed?'Proyek lulus. Lanjut ke ujian akhir.':'Proyek belum lulus. Perbaiki bagian yang belum lolos lalu kirim lagi.'}</div>`:'';
return h+`<div class="row"><button onclick="sp()">Kirim proyek</button></div>`}
function cert(){const c=P.cert;if(!c)return `<a class="bk" onclick="go('home')">Kembali ke daftar</a><h2>Terbitkan sertifikat</h2><p class="mu">Tulis nama lengkap sesuai yang ingin dicantumkan di sertifikat.</p><input type="text" id="cn2" placeholder="Nama lengkap" value="${esc((U.user_metadata||{}).full_name||'')}"><div class="row"><button onclick="ic()">Terbitkan sertifikat</button></div>`;
const dt=new Date(c.issued_at).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
return `<a class="bk" onclick="go('home')">Kembali ke daftar</a><h2>Sertifikat kelulusan</h2><div id="cert"><p>YAWIN SaaS Academy</p><h2>Sertifikat Kelulusan</h2><p>Diberikan kepada</p><div class="nm">${esc(c.full_name)}</div><p>yang telah menyelesaikan program 4 minggu<br><b>Dasar Coding, Database, dan Pembuatan Aplikasi SaaS</b><br>dengan lulus seluruh kuis, proyek akhir, dan ujian akhir.</p><p style="font-size:13px">Tanggal ${dt} &nbsp;|&nbsp; ID ${esc(c.id)}</p></div><p class="mu">Keaslian sertifikat ini bisa diperiksa siapa saja lewat kolom Verifikasi sertifikat di halaman masuk, dengan memasukkan ID di atas.</p><div class="row"><button onclick="window.print()">Cetak atau simpan PDF</button></div>`}
function render(){let h;if(!READY)h='<p class="mu" style="padding:30px 0"><span class="spn"></span>Memuat…</p>';else if(!U)h=auth();else h=V[0]==='r'?reader():V==='home'?home():V==='quiz'?quiz():V==='pj'?pj():V==='cert'?cert():mod(+V.slice(1));const m=MSG?`<div class="bn ${/berhasil/i.test(MSG)?'p':'f'}">${esc(MSG)}</div>`:'';$('#app').innerHTML=m+h}
const AM={fin:'Menyimpan progres…',signup:'Mendaftarkan akun…',signin:'Sedang masuk…',vcert:'Memeriksa sertifikat…',tg:'Menyimpan…',vf:'Memeriksa jawaban…',start:'Menyiapkan soal…',sub:'Menilai jawaban…',sp:'Memeriksa proyek…',ic:'Menerbitkan sertifikat…'};
let LB=null,BUSY=false;
addEventListener('click',e=>{LB=e.target.closest('button,label.l')},true);
addEventListener('change',e=>{LB=e.target.closest('label.l')},true);
Object.keys(AM).forEach(n=>{const f=window[n];window[n]=async function(...a){if(BUSY)return;BUSY=true;const el=LB;if(el)el.classList.add('ld');document.body.dataset.m=AM[n];document.body.classList.add('busy');try{return await f.apply(this,a)}finally{BUSY=false;document.body.classList.remove('busy');if(MSG)scrollTo({top:0,behavior:'smooth'});setTimeout(()=>{if(el&&el.isConnected)el.classList.remove('ld')},300)}}});
db.auth.onAuthStateChange((ev,s)=>{if(!['INITIAL_SESSION','SIGNED_IN','SIGNED_OUT'].includes(ev))return;U=s?s.user:null;if(U&&ev==='SIGNED_IN'){READY=false;render()}setTimeout(async()=>{if(U)await load();else{P=blank();V='home';A=null}READY=true;render()},0)});
render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
